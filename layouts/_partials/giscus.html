{{ with site.Params.giscus }}
	<script src="https://giscus.app/client.js"
		data-repo="{{ .repo }}"
		data-repo-id="{{ .repo_id }}"
		data-category="{{ .category }}"
		data-category-id="{{ .category_id }}"
		data-mapping="{{ .mapping | default "pathname" }}"
		data-strict="{{ .strict | default "1" }}"
		data-reactions-enabled="{{ .reactions_enabled | default "1" }}"
		data-emit-metadata="{{ .emit_metadata | default "0" }}"
		data-input-position="{{ .input_position | default "top" }}"
		data-theme="{{ .theme | default "preferred_color_scheme" }}"
		data-lang="{{ .lang | default "en" }}"
		data-loading="lazy"
		crossorigin="anonymous"
		async>
	</script>
{{ end }}
